[package]
name = "proxy-finder"
version = "0.1.16"
edition = "2021"
license = "MIT"

[lib]
name = "proxy_finder"
path = "src/lib.rs"

[[bin]]
name = "proxy-finder"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "gzip"] }
tokio-socks = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
anyhow = "1"
rand = "0.8"
futures = "0.3"
# già presente tramite eframe: decodifica l'atlante delle bandiere
image = { version = "0.25", default-features = false, features = ["png"] }
# già presente tramite reqwest/image: decomprime la tabella IP -> ASN (ip2asn-v4.tsv.gz)
flate2 = "1"

# icona nel vassoio di sistema (StatusNotifierItem su D-Bus), comando `tray`: solo Linux
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[dev-dependencies]
tempfile = "3"
